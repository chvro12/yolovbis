[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-capacity"
version = "0.1.0"
description = "CLI : capacité de stationnement par adresse (France) — OSM + secours orthophoto IGN"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.0",
    "typer>=0.12",
    "numpy>=1.24",
    "Pillow>=10.0",
    "torch>=2.0",
    "transformers>=4.40",
    "tqdm>=4.65",
    "opencv-python-headless>=4.8",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["gradio>=4.44"]
train = ["torchvision>=0.15"]
train_satellite = [
    "torchvision>=0.15",
    "accelerate>=0.25",
    "datasets>=2.14",
    "ultralytics>=8.0.196",
]
vision = []
all = ["torchvision>=0.15", "gradio>=4.44", "pyyaml>=6.0"]

[project.scripts]
parking-capacity = "parking_capacity.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
